">genera el embedding y busca coincidencias.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="302.0659" x="752" y="247.6899">Lo ejecuta el Backend IA, componente de PATITAS.</text></g><g class="entity" data-entity="GMN22" data-source-line="276" data-uid="ent0023" id="entity_GMN22"><path d="M436.5,118.0986 L436.5,157.9961 L670.686,157.9961 L670.686,128.0986 L660.686,118.0986 L436.5,118.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M660.686,118.0986 L660.686,128.0986 L670.686,128.0986 L660.686,118.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.186" x="442.5" y="135.2925">Cada 5 minutos, reportes que siguen</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="132.2598" x="442.5" y="150.2412">pendientes de an&#225;lisis.</text></g><g class="entity" data-entity="GMN25" data-source-line="280" data-uid="ent0026" id="entity_GMN25"><path d="M465.5,43.0986 L465.5,82.9961 L641.167,82.9961 L641.167,53.0986 L631.167,43.0986 L465.5,43.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M631.167,43.0986 L631.167,53.0986 L641.167,53.0986 L631.167,43.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="154.667" x="471.5" y="60.2925">Solo el autor de uno de los</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140.9116" x="471.5" y="75.2412">dos reportes vinculados.</text></g><!--reverse link REG to VER--><g class="link" data-entity-1="REG" data-entity-2="VER" data-source-line="253" data-uid="lnk6" id="link_REG_VER"><path d="M148.9784,440.5982 C168.7284,432.7182 173.69,430.7386 192.9,423.0786" fill="none" id="REG-backto-VER" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="132.2