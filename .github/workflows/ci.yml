name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://patitas:patitas@localhost:5432/patitas
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Build and start PostgreSQL
        run: |
          docker build -t patitas-postgres ./docker/postgres
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=patitas \
            -e POSTGRES_PASSWORD=patitas \
            -e POSTGRES_DB=patitas \
            -p 5432:5432 \
            patitas-postgres
          until docker exec postgres pg_isready -U patitas; do sleep 2; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run tests
        working-directory: backend
        run: npm test -- --coverage --coverageReporters=text-summary

  backend-ia:
    name: Backend IA (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start PostgreSQL
        run: |
          docker build -t patitas-postgres ./docker/postgres
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=patitas \
            -e POSTGRES_PASSWORD=patitas \
            -e POSTGRES_DB=patitas \
            -p 5432:5432 \
            patitas-postgres
          until docker exec postgres pg_isready -U patitas; do sleep 2; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node.js dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://patitas:patitas@localhost:5432/patitas
        run: npx prisma migrate deploy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-ia/requirements.txt

      - name: Install Python dependencies
        working-directory: backend-ia
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend-ia
        env:
          DATABASE_URL: postgresql+asyncpg://patitas:patitas@localhost:5432/patitas
        run: python -m pytest tests/ -v
