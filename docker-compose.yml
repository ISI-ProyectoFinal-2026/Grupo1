services:
  postgres:
    build: ./docker/postgres
    container_name: patitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patitas}
      POSTGRES_DB: ${POSTGRES_DB:-patitas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patitas} -d ${POSTGRES_DB:-patitas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
