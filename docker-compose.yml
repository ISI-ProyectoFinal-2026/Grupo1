services:
  postgres:
    build: ./docker/postgres
    container_name: patitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patitas}
      POSTGRES_DB: ${POSTGRES_DB:-patitas}
    ports:
      # 5433 en el host: evita choques con un Postgres nativo local en 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patitas} -d ${POSTGRES_DB:-patitas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backup diario de la base y de las imágenes (docs/BACKUP.md).
  # Perfil propio: solo arranca con `docker compose --profile backup up -d`.
  backup:
    build: ./backup
    container_name: patitas-backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backup/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-patitas}:${POSTGRES_PASSWORD:-patitas}@postgres:5432/${POSTGRES_DB:-patitas}
      BACKUP_DIR: /backups
    volumes:
      # Fuera del repo: por defecto, carpeta hermana ../patitas-backups.
      - ${BACKUP_HOST_DIR:-../patitas-backups}:/backups

volumes:
  postgres_data:
